[package]
name = "se3-ad-recipes"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Frank O. Kuehnel <frank@sigmapointlabs.com>"]
description = "AD recipes for SE(3) Hessians — eight-way bench, companion to SE3_ad_letter §VI / Table I"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sigmapointlabs/se3-ad-recipes"
readme = "README.md"
keywords = ["se3", "lie-group", "automatic-differentiation", "hessian", "slam"]
categories = ["robotics", "science", "mathematics"]

[dependencies]
# Optional integrations only; the default-feature build is zero runtime deps.
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }

[features]
default = []
bench-support = []
# Adds Serialize / Deserialize impls on Pose, ExtendedPose, QuatPose.
# Deserialize routes through the validated constructors so on-disk data
# cannot place a pose in an invalid state.
serde = ["dep:serde"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "nll_hessian"
harness = false
required-features = ["bench-support"]

[[example]]
name = "nees_consistency"
required-features = ["bench-support"]

[[example]]
name = "posegraph_consistency"
required-features = ["bench-support"]
